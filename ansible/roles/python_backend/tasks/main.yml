---
- name: Install Python 3, pip, and virtualenv support
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
    state: present

- name: Create application system group
  group:
    name: "{{ app_group }}"
    system: yes
    state: present

- name: Create dedicated non-root application user
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: yes
    home: "{{ app_dir }}"
    shell: /usr/sbin/nologin
    create_home: no
    state: present

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Deploy Python backend application source code
  copy:
    src: "{{ playbook_dir }}/../../backend/"
    dest: "{{ app_dir }}/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  notify: Restart flask backend

- name: Create Python virtual environment
  command: python3 -m venv "{{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/python"

- name: Upgrade pip inside virtualenv
  pip:
    name: pip
    state: latest
    virtualenv: "{{ venv_dir }}"

- name: Install backend requirements in virtual environment
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
  notify: Restart flask backend

- name: Deploy systemd unit file for Flask Gunicorn service
  template:
    src: flask-backend.service.j2
    dest: /etc/systemd/system/{{ service_name }}.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd daemon
    - Restart flask backend

- name: Flush handlers to ensure service unit is reloaded before starting
  meta: flush_handlers

- name: Enable and start Flask backend service
  systemd:
    name: "{{ service_name }}"
    enabled: yes
    state: started

- name: Wait for Flask backend to bind to 127.0.0.1:{{ app_port }}
  wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    delay: 1
    timeout: 30

- name: Validate local Flask backend health endpoint (/healthz)
  uri:
    url: "http://127.0.0.1:{{ app_port }}/healthz"
    method: GET
    return_content: yes
    status_code: 200
  register: backend_check
  retries: 5
  delay: 2
  until: backend_check.status == 200

- name: Log backend validation result
  debug:
    msg: "Flask backend successfully responded on 127.0.0.1:{{ app_port }}: {{ backend_check.json }}"
